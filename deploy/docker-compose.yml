# A full, self-contained GoblinPay till: the server, its BUNDLED relay, and an
# auto-HTTPS reverse proxy.
#
#   cd deploy
#   cp .env.example .env            # then edit it (domain, tokens)
#   mkdir -p secrets                # drop the mounted-secret files in here
#   docker compose up -d
#
# gives you:
#   - gp-server : the GoblinPay payment server (this repo)
#   - relay     : a stock nostr-rs-relay, the bundled relay GP_RELAY_MODE=bundled
#                 points at (so no third-party relay is needed)
#   - caddy     : auto-TLS reverse proxy terminating HTTPS for both
#
# Set GP_DOMAIN in .env to your own domain BEFORE bringing it up: Caddy obtains
# a certificate for it, so DNS must already point at this host.
#
# NOTE on the build context: the Dockerfile expects the workspace parent
# (`../..`), the directory that holds GoblinPay. No sibling checkout is needed
# any more; the nip44 companion crate comes from crates.io.

services:
  gp-server:
    build:
      context: ../..
      dockerfile: GoblinPay/deploy/Dockerfile
    image: goblinpay:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Bundled relay (default mode). GP_BUNDLED_RELAY_URL is BOTH dialed by the
      # server and advertised to payers in the nprofile, so it must be the
      # relay's PUBLIC url (payers connect here); the server reaches it back
      # through Caddy.
      GP_RELAY_MODE: bundled
      GP_BUNDLED_RELAY_URL: ${GP_BUNDLED_RELAY_URL:-wss://relay.${GP_DOMAIN}}
      GP_PUBLIC_URL: ${GP_PUBLIC_URL:-https://${GP_DOMAIN}}
      GP_BIND: 0.0.0.0:8080
      GP_DB_PATH: /data/goblinpay.db
      GP_DATA_DIR: /data/gp-data
      # Money/identity secrets come from mounted files (never the image/env).
      #
      # TRADE-OFF, be clear-eyed about it: ./secrets on the host is PLAINTEXT,
      # bind-mounted read-only at /run/secrets. Compose has no equivalent of the
      # systemd unit's host-sealed credential, so the seed phrase and the wallet
      # password sit on disk in the clear and a stolen or copied disk yields the
      # wallet. Keep the till a small hot float and sweep regularly.
      #
      # Seal it as far as compose allows:
      #   1. After the first successful boot, DELETE ./secrets/gp_mnemonic and
      #      remove the GP_MNEMONIC_FILE line below (a *_FILE that points at a
      #      missing file is a hard config error, not a skip). The seed is
      #      consumed once to create the wallet; afterwards it lives only
      #      encrypted at rest in the gp-data volume and in your written 24-word
      #      backup, and boot needs the password file alone.
      #   2. chmod 0400 what is left, keep ./secrets out of every image build
      #      context, and keep it out of any backup that leaves the host.
      #   3. For an encrypted-at-rest password, use the bare-metal path instead:
      #      deploy/gp-server.service plus the wizard's LoadCredentialEncrypted
      #      drop-in, where systemd-creds seals the password to the host.
      GP_MNEMONIC_FILE: /run/secrets/gp_mnemonic
      GP_WALLET_PASSWORD_FILE: /run/secrets/gp_wallet_password
      GP_NCRYPTSEC_FILE: /run/secrets/gp_ncryptsec
    volumes:
      - gp-data:/data
      - ./secrets:/run/secrets:ro
    expose:
      - "8080"
    depends_on:
      - relay

  relay:
    image: scsibug/nostr-rs-relay:latest
    restart: unless-stopped
    volumes:
      - ./relay/nostr-rs-relay.toml:/usr/src/app/config.toml:ro
      - relay-data:/usr/src/app/db
    expose:
      - "7777"
    # Bound the relay's footprint so an unauthenticated flood cannot starve the
    # till or proxy on the same host.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - gp-server
      - relay
    environment:
      GP_DOMAIN: ${GP_DOMAIN:-pay.example}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gp-data:
  relay-data:
  caddy-data:
  caddy-config:
