# CI gate for GoblinPay. Mirror of .gitea/workflows/ci.yml, plus the workspace
# trim below (this hosted runner can't reach the private goblin tree; a
# deploy-host runner that has it does not need the trim).
#
# What runs where:
#   - fmt + the gp-core/gp-wallet clippy/test gate run on ANY runner, BUT every
#     cargo command runs `cargo metadata` over the whole workspace first, and
#     gp-goblin-sender has path deps into the private goblin/ tree that a hosted
#     runner can't check out. `-p` scoping does NOT skip that resolution, so the
#     trim step drops it before any cargo command, along with gp-nostr and
#     gp-server (they resolve fine now that nip44 comes from crates.io, but
#     building them pulls the whole arti/Tor and grin stack, which this gate
#     deliberately does not attempt). What's left (gp-core, gp-wallet) is
#     self-contained and holds the domain logic (config, invoices, matching,
#     webhooks, rates, the wallet seam).
#   - The FULL gate (gp-nostr + gp-server + the gp-goblin-sender round-trip, via
#     ./ci.sh) needs the goblin/ tree checked out next to the repo. It runs where
#     the workspace is laid out like the deploy host; otherwise it is skipped
#     below.
name: ci
on:
  push:
    branches: [main, master]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Scope workspace to hosted-runnable crates
        # gp-goblin-sender has path deps into the private goblin tree this
        # hosted runner can't check out, so `cargo metadata` can't resolve it
        # here, and metadata runs before any `-p` scoping. gp-nostr and
        # gp-server resolve fine (nip44 comes from crates.io), but building them
        # pulls the arti/Tor and grin stacks, which this gate does not attempt.
        # Drop all three from the members list so the self-contained core gate
        # (gp-core, gp-wallet) can run. The full workspace is unchanged in the
        # repo and still builds on the deploy host.
        run: sed -i '/crates\/gp-goblin-sender\|crates\/gp-nostr\|crates\/gp-server/d' Cargo.toml

      - name: Format check (self-contained crates)
        run: cargo fmt --all -- --check

      - name: Clippy (gp-core, deny warnings)
        run: cargo clippy -p gp-core --all-targets -- -D warnings

      - name: Test (gp-core)
        run: cargo test -p gp-core --locked

      - name: Test (gp-wallet unit tests)
        # `--lib` only: gp-wallet's two integration tests drive the
        # gp-goblin-sender binary, which the trim above removed (it needs the
        # goblin tree). They run in the full ./ci.sh gate below. The 27 unit
        # tests need nothing outside this repo.
        run: cargo test -p gp-wallet --lib --locked

      - name: Full gate (when the goblin checkout is present)
        run: |
          if [ -d ../goblin ]; then
            echo "goblin sibling present - running the full ./ci.sh gate."
            ./ci.sh
          else
            echo "goblin sibling absent on this runner;"
            echo "the full gp-server gate runs via ./ci.sh on the deploy host."
          fi
